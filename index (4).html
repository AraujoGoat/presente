<script>
/* ===== Poemas: lista + leitor ===== */
(() => {
  const C = window.CONTENT;
  const lista = () => C.poemas || [];
  const favs = () => UI.store.get('favPoemas', []);

  function abrirLeitor(i){
    const w = UI.open('poema', {
      titulo: 'poema.txt', icone: '📜', tom: 'vinho', largura: 440,
      render(body, win){
        let idx = 0, tam = UI.store.get('tamPoema', 18);
        body.innerHTML = `
          <div class="leitor">
            <div class="leitor-topo"><span id="lHumor"></span><div><h2 id="lTitulo"></h2><small id="lData"></small></div></div>
            <div class="poema-texto" id="lTexto"></div>
            <div class="leitor-nav">
              <button class="mini" id="lPrev" aria-label="anterior">‹</button>
              <button class="mini" id="lFav" aria-label="favoritar">♡</button>
              <button class="mini" id="lMenos" aria-label="diminuir letra">A−</button>
              <button class="mini" id="lMais" aria-label="aumentar letra">A+</button>
              <button class="mini" id="lNext" aria-label="próximo">›</button>
            </div>
            <small class="contagem" id="lPos"></small>
          </div>`;
        const $ = s => body.querySelector(s);
        const mostrar = n => {
          const L = lista(); if (!L.length) return;
          idx = (n + L.length) % L.length;
          const p = L[idx];
          win.setTitle(p.titulo.toLowerCase().replace(/\s+/g, '_') + '.txt');
          $('#lHumor').textContent = p.humor || '💗';
          $('#lTitulo').textContent = p.titulo;
          $('#lData').textContent = UI.fmtData(p.data, true);
          $('#lTexto').textContent = p.texto;
          $('#lTexto').style.fontSize = tam + 'px';
          $('#lFav').textContent = favs().includes(p.id) ? '♥' : '♡';
          $('#lPos').textContent = `${idx + 1} de ${L.length}`;
          body.scrollTop = 0;
        };
        win.show = mostrar;
        $('#lPrev').onclick = () => mostrar(idx - 1);
        $('#lNext').onclick = () => mostrar(idx + 1);
        $('#lMenos').onclick = () => { tam = Math.max(14, tam - 2); UI.store.set('tamPoema', tam); $('#lTexto').style.fontSize = tam + 'px'; };
        $('#lMais').onclick  = () => { tam = Math.min(30, tam + 2); UI.store.set('tamPoema', tam); $('#lTexto').style.fontSize = tam + 'px'; };
        $('#lFav').onclick = () => {
          const p = lista()[idx]; let f = favs();
          f = f.includes(p.id) ? f.filter(x => x !== p.id) : [...f, p.id];
          UI.store.set('favPoemas', f);
          $('#lFav').textContent = f.includes(p.id) ? '♥' : '♡';
          if (f.includes(p.id)) UI.toast('guardado nos favoritos ♥');
          win.refreshLista && win.refreshLista();
        };
        win.mostrar = mostrar;
      }
    });
    w.show(i);
    return w;
  }

  UI.registerModule('poemas', {
    titulo: 'poemas_pra_voce.txt', icone: '💌', tom: 'rosa', largura: 480,
    render(body, win){
      const L = lista();
      body.innerHTML = `
        <h2>poemas pra você</h2>
        <p class="sub">${L.length} poema${L.length === 1 ? '' : 's'} escrito${L.length === 1 ? '' : 's'} com carinho ♡</p>
        <div class="busca"><input type="search" id="pBusca" placeholder="buscar poema..."><button class="mini" id="pFav">♡ favoritos</button></div>
        <div class="cards" id="pLista"></div>`;
      let soFav = false;
      const desenhar = () => {
        const q = body.querySelector('#pBusca').value.trim().toLowerCase();
        const f = favs(), el = body.querySelector('#pLista');
        el.innerHTML = '';
        const itens = L.map((p, i) => ({ p, i })).filter(({ p }) =>
          (!soFav || f.includes(p.id)) && (!q || (p.titulo + ' ' + p.texto).toLowerCase().includes(q)));
        if (!itens.length){ el.innerHTML = '<p class="vazio">nenhum poema por aqui ainda 🥺</p>'; return; }
        itens.forEach(({ p, i }) => {
          const b = document.createElement('button');
          b.className = 'card-item';
          b.innerHTML = `<span class="ci-ico">${UI.esc(p.humor || '💗')}</span>
            <span class="ci-txt"><b>${UI.esc(p.titulo)}</b><small>${UI.esc(UI.fmtData(p.data))}</small></span>
            <span class="ci-fav">${f.includes(p.id) ? '♥' : ''}</span>`;
          b.onclick = () => abrirLeitor(i);
          el.appendChild(b);
        });
      };
      body.querySelector('#pBusca').oninput = desenhar;
      body.querySelector('#pFav').onclick = e => { soFav = !soFav; e.currentTarget.classList.toggle('ligado', soFav); desenhar(); };
      win.refreshLista = desenhar;
      desenhar();
    }
  });
})();

</script>
<script>
/* ===== Galeria: polaroids + visualizador (foto, vídeo, youtube) ===== */
(() => {
  const C = window.CONTENT;
  const G = () => C.galeria || { albuns: [], itens: [] };

  const capa = (it, i) => it.src && it.tipo === 'foto' ? it.src : UI.ph(it.icone || (it.tipo === 'foto' ? '📷' : '🎬'), i);

  function midia(it, i){
    const box = document.createElement('div');
    box.className = 'viewer-media';
    if (it.tipo === 'youtube' && it.src){
      box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(it.src)}?rel=0" title="${UI.esc(it.titulo)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    } else if (it.tipo === 'video' && it.src){
      box.innerHTML = `<video controls playsinline preload="metadata" src="${UI.esc(it.src)}"></video>`;
    } else {
      const img = new Image();
      img.alt = it.titulo || '';
      img.src = capa(it, i);
      img.onerror = () => { img.onerror = null; img.src = UI.ph(it.icone || '📷', i); };
      box.appendChild(img);
      if (it.tipo !== 'foto'){
        const t = document.createElement('div'); t.className = 'viewer-play'; t.textContent = '▶';
        box.appendChild(t);
        const aviso = document.createElement('p'); aviso.className = 'sub'; aviso.textContent = 'adicione o arquivo do vídeo no content.js';
        box.appendChild(aviso);
      }
    }
    return box;
  }

  function abrirVisualizador(lista, pos){
    const w = UI.open('foto', {
      titulo: 'visualizador', icone: '🖼️', tom: 'azul', largura: 500,
      render(body, win){
        let L = lista, idx = pos;
        win.mostrar = (nl, n) => {
          L = nl || L;
          idx = (n + L.length) % L.length;
          const { it, i } = L[idx];
          body.innerHTML = '';
          body.appendChild(midia(it, i));
          const leg = document.createElement('div');
          leg.className = 'viewer-leg';
          leg.innerHTML = `<h2>${UI.esc(it.titulo || '')}</h2>
            <p>${UI.esc(it.legenda || '')}</p>
            <small>${UI.esc(UI.fmtData(it.data, true))}</small>
            <div class="leitor-nav"><button class="mini" id="vPrev">‹ anterior</button><span class="contagem">${idx + 1} / ${L.length}</span><button class="mini" id="vNext">próxima ›</button></div>`;
          body.appendChild(leg);
          leg.querySelector('#vPrev').onclick = () => win.mostrar(null, idx - 1);
          leg.querySelector('#vNext').onclick = () => win.mostrar(null, idx + 1);
          win.setTitle((it.titulo || 'visualizador').toLowerCase());
        };
      }
    });
    w.mostrar(lista, pos);
  }

  UI.registerModule('galeria', {
    titulo: 'nossas_fotos.gallery', icone: '📷', tom: 'azul', largura: 520,
    render(body){
      const g = G();
      body.innerHTML = `<h2>nossas fotos & vídeos</h2><p class="sub">${g.itens.length} lembrança${g.itens.length === 1 ? '' : 's'} guardada${g.itens.length === 1 ? '' : 's'} ♡</p><div id="gTabs"></div>`;
      const abas = [{ id: 'todos', nome: 'todos', icone: '💗' }, ...g.albuns];
      UI.tabs(body.querySelector('#gTabs'), abas.map(a => ({
        rotulo: `${a.icone} ${a.nome}`,
        render(el){
          const lista = g.itens.map((it, i) => ({ it, i })).filter(({ it }) => a.id === 'todos' || it.album === a.id);
          if (!lista.length){ el.innerHTML = '<p class="vazio">nada por aqui ainda 🥺</p>'; return; }
          const grade = document.createElement('div'); grade.className = 'polas';
          lista.forEach(({ it, i }, k) => {
            const b = document.createElement('button');
            b.className = 'pola'; b.style.setProperty('--r', ((k * 37) % 7 - 3) + 'deg');
            const img = new Image(); img.loading = 'lazy'; img.alt = it.titulo || '';
            img.src = capa(it, i); img.onerror = () => { img.onerror = null; img.src = UI.ph(it.icone || '📷', i); };
            b.appendChild(img);
            if (it.tipo !== 'foto'){ const t = document.createElement('span'); t.className = 'pola-play'; t.textContent = '▶'; b.appendChild(t); }
            const cap = document.createElement('span'); cap.className = 'pola-cap'; cap.textContent = it.titulo || '';
            b.appendChild(cap);
            b.onclick = () => abrirVisualizador(lista, k);
            grade.appendChild(b);
          });
          el.appendChild(grade);
        }
      })));
    }
  });
})();

</script>

<script>
/* ===== Nossa linha do tempo ===== */
(() => {
  const C = window.CONTENT;

  function haQuanto(data){
    const ini = new Date(C.casal.inicio), d = new Date(data + 'T12:00:00'), hoje = new Date();
    const dias = Math.floor((hoje - d) / 864e5);
    const apos = Math.floor((d - ini) / 864e5);
    const partes = [];
    if (dias >= 0) partes.push(`há ${dias.toLocaleString('pt-BR')} dia${dias === 1 ? '' : 's'}`);
    else partes.push(`em ${-dias} dia${dias === -1 ? '' : 's'}`);
    if (!isNaN(ini) && apos > 0) partes.push(`dia ${apos.toLocaleString('pt-BR')} de nós`);
    return partes.join(' · ');
  }

  UI.registerModule('linha', {
    titulo: 'nossa_linha_do_tempo', icone: '🗓️', tom: 'turq', largura: 480,
    render(body){
      const L = [...(C.linha || [])].sort((a, b) => a.data.localeCompare(b.data));
      body.innerHTML = `<h2>nossa linha do tempo</h2><p class="sub">cada ponto é um pedacinho da nossa história</p><ol class="timeline"></ol>`;
      const ol = body.querySelector('.timeline');
      L.forEach((e, k) => {
        const li = document.createElement('li');
        li.style.animationDelay = (k * 70) + 'ms';
        li.innerHTML = `<span class="tl-no">${UI.esc(e.icone || '💗')}</span>

        ol.appendChild(li);
      });
    }
  });
})();

</script>

        <a class="btn turq" target="_blank" rel="noopener" href="${spBusca(artista, f.titulo)}">♫ Spotify</a></div>`;

<script>
/* ===== Cartinha secreta: trancada por data (e senha opcional) ===== */
(() => {
  const C = window.CONTENT;
  const S = () => C.segredo || {};
  const modoTeste = () => /teste/.test(location.hash);
  const jaAbriu = () => UI.store.get('segredoAberto', false);

  function digitando(el, texto, fim){
    el.textContent = '';
    let i = 0;
    const passo = () => {
      if (!el.isConnected) return;
      const n = texto[i] === '\n' ? 1 : 2;
      el.textContent += texto.slice(i, i + n); i += n;
      el.parentElement && (el.parentElement.scrollTop = el.parentElement.scrollHeight);
      if (i < texto.length) setTimeout(passo, texto[i - 1] === '\n' ? 220 : 28); else fim && fim();
    };
    passo();
  }

  UI.registerModule('cartinha', {
    titulo: 'cartinha_secreta.lock', icone: '🔐', tom: 'vinho', largura: 440,
    render(body, win){
      const s = S();
      const alvo = s.liberaEm ? new Date(s.liberaEm) : null;
      const liberada = () => modoTeste() || !alvo || isNaN(alvo) || new Date() >= alvo;
      let timer;
      win.el.addEventListener('remove', () => clearInterval(timer));

      const telaTrancada = () => {
        body.innerHTML = `<div class="segredo trancado">
          <div class="cadeado">🔒</div>
          <h2>${UI.esc(s.titulo || 'cartinha secreta')}</h2>
          <p>${UI.esc(s.dica || 'ainda não é a hora...')}</p>
          <div class="units" id="sUnits"></div>
          <small>(${alvo && !isNaN(alvo) ? 'abre em ' + UI.fmtData(s.liberaEm, true) : ''})</small></div>`;
        const u = body.querySelector('#sUnits');
        const tick = () => {
          let ms = alvo - new Date();
          if (ms <= 0){ clearInterval(timer); telaSelo(); return; }
          const d = Math.floor(ms / 864e5); ms -= d * 864e5;
          const h = Math.floor(ms / 36e5); ms -= h * 36e5;
          const m = Math.floor(ms / 6e4); ms -= m * 6e4;
          const sec = Math.floor(ms / 1000);
          u.innerHTML = [[d, 'dias'], [h, 'horas'], [m, 'min'], [sec, 'seg']].map(([v, n]) => `<div class="unit"><b>${String(v).padStart(2, '0')}</b><span>${n}</span></div>`).join('');
          u.style.gridTemplateColumns = 'repeat(4,1fr)';
        };
        tick(); timer = setInterval(() => { if (!body.isConnected){ clearInterval(timer); return; } tick(); }, 1000);
      };

      const telaSenha = () => {
        body.innerHTML = `<div class="segredo"><div class="cadeado">🗝️</div><h2>qual é a palavra secreta?</h2>
          <form id="sForm"><input id="sSenha" type="text" autocomplete="off" placeholder="digite aqui..." aria-label="senha"><button class="btn rosa" type="submit">abrir</button></form>
          <small>${s.dica ? UI.esc(s.dica) : ''}</small></div>`;
        body.querySelector('#sForm').onsubmit = e => {
          e.preventDefault();
          const v = body.querySelector('#sSenha').value.trim().toLowerCase();
          if (v === String(s.senha).trim().toLowerCase()){ telaSelo(true); }
          else { UI.toast('hmm, não é essa... 🤔'); body.querySelector('#sSenha').select(); }
        };
      };

      const telaSelo = ok => {
        if (s.senha && !ok && !jaAbriu() && !modoTeste()) return telaSenha();
        body.innerHTML = `<div class="segredo"><h2>${UI.esc(s.titulo || 'cartinha secreta')}</h2>
          <p>segure o selo pra quebrar ♥</p>
          <button class="selo-grande" id="sSelo" aria-label="segurar para abrir"><span>♥</span><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" /></svg></button></div>`;
        const b = body.querySelector('#sSelo'), ring = b.querySelector('circle');
        ring.style.strokeDasharray = 289; ring.style.strokeDashoffset = 289;
        let ini = 0, raf = 0;
        const loop = () => {
          const p = Math.min(1, (performance.now() - ini) / 1400);
          ring.style.strokeDashoffset = 289 * (1 - p);
          if (p >= 1){ abrir(); return; }
          raf = requestAnimationFrame(loop);
        };
        const comeca = e => { e.preventDefault(); ini = performance.now(); b.classList.add('segurando'); raf = requestAnimationFrame(loop); };
        const para = () => { cancelAnimationFrame(raf); b.classList.remove('segurando'); ring.style.strokeDashoffset = 289; };
        b.addEventListener('pointerdown', comeca);
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, para));
        b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') abrir(); });
        b.addEventListener('contextmenu', e => e.preventDefault());
      };

      const abrir = () => {
        UI.store.set('segredoAberto', true);
        body.innerHTML = `<div class="papel segredo-carta"><h3>${UI.esc(s.titulo || '')}</h3><div class="papel-texto" id="sTexto"></div><p class="assina" id="sAss"></p></div>`;
        if (window.Eggs) Eggs.chuva(['💗', '✨', '💌'], 26);
        digitando(body.querySelector('#sTexto'), s.texto || '', () => { body.querySelector('#sAss').textContent = s.assinatura || ''; });
      };

      if (!liberada()) telaTrancada(); else telaSelo();
    }
  });
})();

</script>

<script>
/* ===== Mini-game: pega-corações (pixel) ===== */
(() => {
  const W = 120, H = 160;
  let parar = () => {};

  UI.registerModule('jogo', {
    titulo: 'pega_coracoes.exe', icone: '🎮', tom: 'vinho', largura: 380,
    aoFechar: () => parar(),
    render(body){
      body.innerHTML = `
        <div class="jogo">
          <div class="jogo-hud"><span>♥ <b id="jPts">0</b></span><span id="jVidas">❤️❤️❤️</span><span>🏆 <b id="jMelhor">0</b></span></div>
          <div class="jogo-area">
            <canvas width="${W}" height="${H}"></canvas>
            <div class="jogo-over" id="jOver"><h2>pega-corações</h2><p>pegue os ♥ e as ★<br>fuja das caveiras 💀<br><small>arraste o dedo (ou use ← →)</small></p><button class="btn rosa" id="jGo">jogar</button></div>
          </div>
        </div>`;
      const cv = body.querySelector('canvas'), g = cv.getContext('2d');
      g.imageSmoothingEnabled = false;
      const $ = s => body.querySelector(s);
      let melhor = UI.store.get('melhorJogo', 0); $('#jMelhor').textContent = melhor;

      const SPR = {
        h: ['.X.X.', 'XXXXX', 'XXXXX', '.XXX.', '..X..'],
        s: ['..X..', '.XXX.', 'XXXXX', '.XXX.', 'X...X'],
        k: ['.XXX.', 'XXXXX', 'X.X.X', '.XXX.', '.X.X.']
      };
      const COR = { h: '#ff4f86', s: '#ffd23f', k: '#ffffff' };
      const desenhaSpr = (t, x, y) => {
        SPR[t].forEach((l, j) => [...l].forEach((c, i) => {
          if (c !== 'X') return;
          g.fillStyle = t === 'k' && (j === 2 && (i === 1 || i === 3)) ? '#4e1124' : COR[t];
          g.fillRect(Math.round(x) + i, Math.round(y) + j, 1, 1);
        }));
      };

      let est, rodando = false, raf = 0, ult = 0;
      const novo = () => ({ x: W / 2, alvo: W / 2, itens: [], t: 0, prox: .5, pts: 0, vidas: 3, esq: 0, dir: 0, fim: false, flash: 0 });
      est = novo();

      const basket = (x, flash) => {
        const y = 146;
        g.fillStyle = '#4e1124'; g.fillRect(x - 10, y - 1, 21, 10);
        g.fillStyle = flash > 0 ? '#ffffff' : '#ffc2d4'; g.fillRect(x - 9, y, 19, 8);
        g.fillStyle = '#ff8fb1'; for (let i = -9; i < 10; i += 4) g.fillRect(x + i, y, 1, 8);
        g.fillRect(x - 9, y + 3, 19, 1);
        g.fillStyle = '#4e1124'; g.fillRect(x - 4, y + 2, 2, 2); g.fillRect(x + 3, y + 2, 2, 2); g.fillRect(x - 1, y + 5, 3, 1);
        g.fillStyle = '#4e1124'; g.fillRect(x - 11, y - 3, 2, 4); g.fillRect(x + 10, y - 3, 2, 4);
      };

      const quadro = agora => {
        if (!rodando) return;
        const dt = Math.min(.05, (agora - ult) / 1000 || 0); ult = agora;
        const e = est; e.t += dt; e.flash = Math.max(0, e.flash - dt);
        // controle
        const v = 110;
        if (e.esq) e.alvo -= v * dt; if (e.dir) e.alvo += v * dt;
        e.alvo = Math.max(11, Math.min(W - 11, e.alvo));
        e.x += (e.alvo - e.x) * Math.min(1, dt * 16);
        // criar
        e.prox -= dt;
        if (e.prox <= 0){
          const r = Math.random(), k = r < .62 ? 'h' : r < .72 ? 's' : 'k';
          e.itens.push({ t: k, x: 4 + Math.random() * (W - 12), y: -6 });
          e.prox = Math.max(.32, .8 - e.t * .01);
        }
        const vel = Math.min(95, 38 + e.t * 1.6);
        for (let i = e.itens.length - 1; i >= 0; i--){
          const it = e.itens[i]; it.y += vel * dt;
          if (it.y > 143 && it.y < 154 && Math.abs(it.x + 2 - e.x) < 11){
            if (it.t === 'k'){ e.vidas--; e.flash = .25; $('#jVidas').textContent = '❤️'.repeat(Math.max(0, e.vidas)) || '💔'; }
            else { e.pts += it.t === 's' ? 5 : 1; $('#jPts').textContent = e.pts; }
            e.itens.splice(i, 1);
            if (e.vidas <= 0) return terminar();
          } else if (it.y > H) e.itens.splice(i, 1);
        }
        // desenho
        for (let i = 0; i < 8; i++){ g.fillStyle = i % 2 ? '#8fd3ff' : '#9fe3f5'; g.fillRect(0, i * 20, W, 20); }
        g.fillStyle = '#ffffff55'; [[10, 20], [70, 40], [40, 80], [95, 110]].forEach(([x, y]) => { g.fillRect(x, y, 12, 3); g.fillRect(x + 3, y - 2, 6, 3); });
        g.fillStyle = '#f6dca8'; g.fillRect(0, 154, W, 6);
        e.itens.forEach(it => desenhaSpr(it.t, it.x, it.y));
        basket(Math.round(e.x), e.flash);
        raf = requestAnimationFrame(quadro);
      };

      const iniciar = () => {
        est = novo(); $('#jPts').textContent = 0; $('#jVidas').textContent = '❤️❤️❤️';
        $('#jOver').hidden = true; rodando = true; ult = performance.now(); raf = requestAnimationFrame(quadro);
      };
      const terminar = () => {
        rodando = false; cancelAnimationFrame(raf);
        const novoRec = est.pts > melhor;
        if (novoRec){ melhor = est.pts; UI.store.set('melhorJogo', melhor); $('#jMelhor').textContent = melhor; }
        $('#jOver').hidden = false;
        $('#jOver').innerHTML = `<h2>fim de jogo!</h2><p>você fez <b>${est.pts}</b> pontos${novoRec ? '<br>🏆 novo recorde!' : ''}${est.pts >= 30 ? '<br>você é craque! 🎮' : ''}</p><button class="btn rosa" id="jGo">jogar de novo</button>`;
        $('#jGo').onclick = iniciar;
        if (novoRec && est.pts >= 20 && window.Eggs) Eggs.chuva(['🏆', '💖', '⭐'], 18);
      };
      parar = () => { rodando = false; cancelAnimationFrame(raf); document.removeEventListener('keydown', teclaD); document.removeEventListener('keyup', teclaU); };

      const mover = e => { const r = cv.getBoundingClientRect(); est.alvo = (e.clientX - r.left) / r.width * W; };
      cv.addEventListener('pointermove', mover);
      cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); mover(e); });
      const teclaD = e => { if (e.key === 'ArrowLeft') est.esq = 1; if (e.key === 'ArrowRight') est.dir = 1; };
      const teclaU = e => { if (e.key === 'ArrowLeft') est.esq = 0; if (e.key === 'ArrowRight') est.dir = 0; };
      document.addEventListener('keydown', teclaD); document.addEventListener('keyup', teclaU);
      $('#jGo').onclick = iniciar;
    }
  });
})();

</script>
<script>

    if (e && e.preventDefault) e.preventDefault();

  /* janela principal */

    b.innerHTML = `${UI.esc(m.icone)} ${UI.esc(m.rotulo)}${pronto ? '' : ' <span class="lock">🔒</span>'}`;
    b.onclick = () => {
      if (m.id === 'inicio') $('cardBody').scrollTo({ top: 0, behavior: 'smooth' });
      else UI.launch(m.id);
    };
    menu.appendChild(b);
  });

  Home.render($('cardBody'));

  const carinhos = ['te amo ♥', 'você é demais!', 'ganhou um abraço 🫂', 'sorria, é pra você 😊', 'que coisa linda ✨'];
  let ci = 0;
  $('btnHeart').onclick = () => UI.toast(carinhos[ci++ % carinhos.length]);
  $('btnX').onclick = () => UI.toast('calma! ainda tem muita coisa pra ver 🥺');
  $('btnMin').onclick = () => $('card').classList.toggle('recolhido');

  // atalho para desenvolver: index.html#pular abre direto
  if (/pular/.test(location.hash)){ intro.remove(); $('stage').hidden = false; }
})();

</script>
